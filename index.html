<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sport Club Renese</title>
  <meta name="description" content="App dello Sport Club Renese: allenamenti, gare, eventi, presenze e classifiche di canottaggio.">
  <meta name="theme-color" content="#0b2a5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SC Renese">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Home">
        <img src="icons/logo.svg" alt="" class="brand-logo">
        <span class="brand-text"><b>Sport Club</b><span>Renese</span></span>
      </a>
      <div class="top-actions">
        <span data-update-slot></span>
        <button id="btn-me" class="avatar" type="button" aria-label="Il mio profilo" hidden></button>
      </div>
    </header>
    <div id="demo-bar" class="demo-bar" hidden></div>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" hidden>
      <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></a>
      <a href="#calendario" data-tab="calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendario</span></a>
      <a href="#allenamenti" data-tab="allenamenti"><svg viewBox="0 0 24 24"><path d="M4 20 20 4"/><path d="M15 3.5c2-1 4.5 1.5 3.5 3.5L16 9.5 14.5 8 15 3.5z"/><path d="M3 16c2 1 3 1 5 0s3-1 5 0 3 1 5 0"/></svg><span>Allenamenti</span></a>
      <a href="#gare" data-tab="gare"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg><span>Gare</span></a>
      <a href="#eventi" data-tab="eventi"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9L12 3z"/></svg><span>Eventi</span></a>
      <a href="#classifiche" data-tab="classifiche"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"/></svg><span>Classifiche</span></a>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/aggiornamenti.js" data-version="1.0.0"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
