name: Aggiorna classifiche FICSF

on:
  schedule:
    - cron: '37 4 * * *'   # ogni giorno verso le 5:37 (ora italiana invernale)
  workflow_dispatch:       # tasto "Run workflow" per aggiornarle subito

permissions:
  contents: write

concurrency:
  group: classifiche
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti per leggere i PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Leggi classifiche e notizie dal sito FICSF
        run: python3 scripts/aggiorna_classifiche.py

      - name: Salva i dati aggiornati
        run: |
          if git diff --quiet -- data/; then
            echo "Nessuna novità da salvare"
          else
            git config user.name "classifiche-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Classifiche FICSF aggiornate"
            git push
          fi
